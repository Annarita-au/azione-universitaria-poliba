<script>

const URL_AVVISI = "https://script.google.com/macros/s/AKfycbzX0r_ySf8e6VYFN_zZYSkLx8w6oHTAo1HuNFIacBkjtr3wTlMZM2BmKDF99luxJAfGkw/exec";

let tuttiGliAvvisi = [];
let categoriaAttuale = "Tutti";

function formattaData(data) {

    if (!data) {
        return "";
    }

    const valore = String(data);

    const match = valore.match(/^(\d{4})-(\d{2})-(\d{2})/);

    if (match) {
        return match[3] + "/" + match[2] + "/" + match[1];
    }

    return valore;
}

function dataPerOrdinamento(data) {

    if (!data) {
        return 0;
    }

    const valore = String(data);

    const match = valore.match(/^(\d{4})-(\d{2})-(\d{2})/);

    if (match) {
        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        ).getTime();
    }

    const parsed = Date.parse(valore);

    return isNaN(parsed) ? 0 : parsed;
}

function mostraAvvisi() {

    const contenitore = document.getElementById("lista-avvisi");

    let avvisi = tuttiGliAvvisi.filter(function(avviso) {

        if (categoriaAttuale === "Tutti") {
            return true;
        }

        return avviso.categoria === categoriaAttuale;
    });

    avvisi.sort(function(a, b) {

        return dataPerOrdinamento(b.data) - dataPerOrdinamento(a.data);

    });

    if (avvisi.length === 0) {

        contenitore.innerHTML =
            '<div class="nessun-avviso">Nessun avviso disponibile.</div>';

        return;
    }

    contenitore.innerHTML = "";

    avvisi.forEach(function(avviso) {

        const elemento = document.createElement("div");

        elemento.className = "avviso";

        let importanteHTML = "";

        if (avviso.importante) {
            importanteHTML = '<div class="importante">⚠ IMPORTANTE</div>';
        }

        elemento.innerHTML =
            importanteHTML +
            "<h3>" + escapeHTML(avviso.titolo) + "</h3>" +
            '<div class="meta">' +
            escapeHTML(avviso.categoria || "") +
            " • " +
            escapeHTML(formattaData(avviso.data)) +
            "</div>" +
            '<div class="anteprima">' +
            escapeHTML(avviso.testo || "") +
            "</div>";

        elemento.addEventListener("click", function() {
            apriModal(avviso);
        });

        contenitore.appendChild(elemento);
    });
}

function escapeHTML(testo) {

    const div = document.createElement("div");

    div.textContent = testo == null ? "" : String(testo);

    return div.innerHTML;
}

function filtra(categoria, pulsante) {

    categoriaAttuale = categoria;

    document.querySelectorAll(".filtri button").forEach(function(button) {
        button.classList.remove("attivo");
    });

    pulsante.classList.add("attivo");

    mostraAvvisi();
}

function apriModal(avviso) {

    const modal = document.getElementById("modal");

    document.getElementById("modal-titolo").textContent =
        avviso.titolo || "";

    document.getElementById("modal-meta").textContent =
        (avviso.categoria || "") +
        " • " +
        formattaData(avviso.data);

    document.getElementById("modal-testo").textContent =
        avviso.testo || "";

    if (avviso.importante) {

        document.getElementById("modal-importante").innerHTML =
            '<div class="importante">⚠ IMPORTANTE</div>';

    } else {

        document.getElementById("modal-importante").innerHTML = "";
    }

    modal.classList.add("aperta");
}

function chiudiModal() {

    document.getElementById("modal").classList.remove("aperta");
}

function chiudiSeFuori(event) {

    if (event.target.id === "modal") {
        chiudiModal();
    }
}

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        chiudiModal();
    }

});

function caricaAvvisi() {

    const script = document.createElement("script");

    script.src = URL_AVVISI +
        "?callback=riceviAvvisi&t=" +
        new Date().getTime();

    document.body.appendChild(script);
}

function riceviAvvisi(dati) {

    if (!Array.isArray(dati)) {

        document.getElementById("lista-avvisi").innerHTML =
            '<div class="nessun-avviso">Nessun avviso disponibile.</div>';

        return;
    }

    tuttiGliAvvisi = dati;

    mostraAvvisi();
}

caricaAvvisi();

</script>
